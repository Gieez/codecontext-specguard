<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SpecGuard Logo Preview</title>
  <style>
    body {
      margin: 0;
      padding: 32px;
      background: #070A10;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #E6EDF8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      max-width: 480px;
      text-align: center;
    }
    .logo-frame {
      width: 220px;
      height: 220px;
      filter: drop-shadow(0 20px 40px rgba(0, 199, 230, 0.25));
    }
    h1 {
      margin: 0;
      font-size: 26px;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #FFFFFF 30%, #00C7E6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      margin: 0;
      font-size: 14px;
      color: #8C9BAB;
      line-height: 1.5;
    }
    .badges {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .badge {
      background: rgba(0, 82, 204, 0.2);
      border: 1px solid rgba(0, 199, 230, 0.4);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 11px;
      color: #00C7E6;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-frame">
      <img src="logo.svg" alt="CodeContext SpecGuard Logo" width="220" height="220" />
    </div>
    <h1>CodeContext SpecGuard</h1>
    <p>Autonomous Spec Audit & Traceability Engine on Atlassian Forge</p>
    <div class="badges">
      <span class="badge">Atlassian Rovo</span>
      <span class="badge">Model Context Protocol</span>
      <span class="badge">UI Kit 2</span>
    </div>
  </div>
</body>
</html>
