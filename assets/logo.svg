<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0E1626" />
      <stop offset="100%" stop-color="#070A10" />
    </radialGradient>

    <!-- Shield Border Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052CC" />
      <stop offset="50%" stop-color="#00C7E6" />
      <stop offset="100%" stop-color="#36B37E" />
    </linearGradient>

    <!-- Core Glow Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00C7E6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0052CC" stop-opacity="0.2" />
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feComposite in="SourceGraphic" in2="blur2" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)" stroke="#1F2A3D" stroke-width="2" />

  <!-- Outer Context Graph Network (Teamwork Graph Representation) -->
  <g opacity="0.4" stroke="#00C7E6" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="256" y1="72" x2="128" y2="160" />
    <line x1="256" y1="72" x2="384" y2="160" />
    <line x1="128" y1="160" x2="148" y2="340" />
    <line x1="384" y1="160" x2="364" y2="340" />
    <line x1="148" y1="340" x2="256" y2="430" />
    <line x1="364" y1="340" x2="256" y2="430" />
  </g>

  <!-- Graph Orbit Nodes -->
  <circle cx="256" cy="72" r="7" fill="#00C7E6" filter="url(#neonGlow)" />
  <circle cx="128" cy="160" r="6" fill="#0052CC" />
  <circle cx="384" cy="160" r="6" fill="#36B37E" />
  <circle cx="148" cy="340" r="5" fill="#00C7E6" />
  <circle cx="364" cy="340" r="5" fill="#0052CC" />
  <circle cx="256" cy="430" r="7" fill="#36B37E" filter="url(#neonGlow)" />

  <!-- Outer Shield Aura -->
  <path d="M256 100 L380 165 C380 290 325 375 256 415 C187 375 132 290 132 165 Z"
        fill="url(#coreGrad)" opacity="0.25" filter="url(#softGlow)" />

  <!-- Main Sentinel Shield -->
  <path d="M256 108 L372 170 C372 284 320 365 256 402 C192 365 140 284 140 170 Z"
        fill="#09101D" stroke="url(#shieldGrad)" stroke-width="7" stroke-linejoin="round" />

  <!-- Inner Geometric Circuit Accents -->
  <path d="M256 136 L344 186 C344 266 304 332 256 364 C208 332 168 266 168 186 Z"
        fill="none" stroke="#1D2E47" stroke-width="2.5" />

  <!-- Code Context Brackets: < /> & Verification Checkmark -->
  <!-- Left Code Bracket: < -->
  <path d="M226 215 L190 252 L226 289"
        fill="none" stroke="#00C7E6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#neonGlow)" />

  <!-- Right Code Bracket: > -->
  <path d="M286 215 L322 252 L286 289"
        fill="none" stroke="#00C7E6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#neonGlow)" />

  <!-- Center Verified Sentinel Checkmark -->
  <path d="M228 254 L248 274 L294 226"
        fill="none" stroke="#36B37E" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#neonGlow)" />

  <!-- Atlassian Anchor Pulse Ring -->
  <circle cx="256" cy="254" r="14" fill="none" stroke="#00C7E6" stroke-width="2" opacity="0.6" stroke-dasharray="3 3" />
</svg>
